<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Job Copilot evidence-aware architecture</title>
  <desc id="desc">Architecture showing public recruiter-safe implementation, broader private product implementation, and in-progress strengthening work for Job Copilot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1630"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6ea8fe"/>
    </marker>
    <style>
      .title{font:700 30px Inter,Arial,sans-serif;fill:#f8fbff}
      .subtitle{font:400 15px Inter,Arial,sans-serif;fill:#9fb1c8}
      .section{font:700 15px Inter,Arial,sans-serif;letter-spacing:.08em}
      .boxTitle{font:700 15px Inter,Arial,sans-serif;fill:#f8fbff}
      .boxText{font:400 12.5px Inter,Arial,sans-serif;fill:#c9d6e7}
      .small{font:400 11.5px Inter,Arial,sans-serif;fill:#9fb1c8}
      .legend{font:600 12px Inter,Arial,sans-serif;fill:#dce7f5}
      .public{stroke:#38d39f}
      .private{stroke:#8b7cf6}
      .progress{stroke:#f6b84a}
      .pipe{stroke:#6ea8fe;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <rect x="30" y="28" width="1140" height="704" rx="22" fill="#0b1627" stroke="#1f3655"/>

  <text x="58" y="72" class="title">Job Copilot</text>
  <text x="58" y="98" class="subtitle">Evidence-aware product architecture · public implementation separated from broader private work</text>

  <g transform="translate(730 44)">
    <text x="0" y="0" class="section" fill="#d9e6f7">EVIDENCE STATUS</text>
    <circle cx="8" cy="24" r="6" fill="#38d39f"/><text x="22" y="28" class="legend">● Implemented — Public</text>
    <circle cx="194" cy="24" r="6" fill="#8b7cf6"/><text x="208" y="28" class="legend">◆ Implemented — Private</text>
    <circle cx="390" cy="24" r="6" fill="#f6b84a"/><text x="404" y="28" class="legend">◐ In Progress</text>
  </g>

  <text x="58" y="145" class="section" fill="#52e0b0">● PUBLIC RECRUITER-SAFE SHOWCASE</text>

  <g filter="url(#shadow)">
    <rect x="58" y="168" width="170" height="122" rx="14" fill="#0d2130" stroke-width="2" class="public"/>
    <text x="76" y="194" class="boxTitle">Raw Job + Source</text>
    <text x="76" y="220" class="boxText"><tspan x="76" dy="0">Synthetic input</tspan><tspan x="76" dy="18">Source attribution</tspan><tspan x="76" dy="18">Connector policy context</tspan></text>

    <rect x="258" y="168" width="170" height="122" rx="14" fill="#0d2130" stroke-width="2" class="public"/>
    <text x="276" y="194" class="boxTitle">Normalize</text>
    <text x="276" y="220" class="boxText"><tspan x="276" dy="0">normalizeJob()</tspan><tspan x="276" dy="18">Employment type</tspan><tspan x="276" dy="18">Skills / URL / fields</tspan></text>

    <rect x="458" y="168" width="170" height="122" rx="14" fill="#0d2130" stroke-width="2" class="public"/>
    <text x="476" y="194" class="boxTitle">Governed Ingestion</text>
    <text x="476" y="220" class="boxText"><tspan x="476" dy="0">Connector eligibility</tspan><tspan x="476" dy="18">Fresh / stale / unknown</tspan><tspan x="476" dy="18">Accept / reject + reason</tspan></text>

    <rect x="658" y="168" width="170" height="122" rx="14" fill="#0d2130" stroke-width="2" class="public"/>
    <text x="676" y="194" class="boxTitle">Deduplicate</text>
    <text x="676" y="220" class="boxText"><tspan x="676" dy="0">Cross-source fingerprint</tspan><tspan x="676" dy="18">company | title | location</tspan><tspan x="676" dy="18">Normalized job batch</tspan></text>

    <rect x="858" y="168" width="170" height="122" rx="14" fill="#0d2130" stroke-width="2" class="public"/>
    <text x="876" y="194" class="boxTitle">Deterministic Match</text>
    <text x="876" y="220" class="boxText"><tspan x="876" dy="0">calculateMatch()</tspan><tspan x="876" dy="18">Score + matched skills</tspan><tspan x="876" dy="18">Missing skills</tspan></text>

    <rect x="1058" y="168" width="84" height="122" rx="14" fill="#0d2130" stroke-width="2" class="public"/>
    <text x="1071" y="194" class="boxTitle">React UI</text>
    <text x="1071" y="220" class="boxText"><tspan x="1071" dy="0">JobMatch</tspan><tspan x="1071" dy="18">Card</tspan><tspan x="1071" dy="18">example</tspan></text>
  </g>

  <path d="M228 229 H250" class="pipe"/><path d="M428 229 H450" class="pipe"/><path d="M628 229 H650" class="pipe"/><path d="M828 229 H850" class="pipe"/><path d="M1028 229 H1050" class="pipe"/>

  <rect x="58" y="316" width="1084" height="78" rx="14" fill="#0c1b2a" stroke="#244462"/>
  <text x="78" y="344" class="boxTitle">Public verification</text>
  <text x="78" y="370" class="boxText">19 Vitest cases across 7 test files · TypeScript type checking · GitHub Actions CI · synthetic examples · no production credentials</text>

  <text x="58" y="440" class="section" fill="#a79cff">◆ BROADER PRIVATE PRODUCT IMPLEMENTATION</text>

  <g filter="url(#shadow)">
    <rect x="58" y="462" width="210" height="116" rx="14" fill="#17152d" stroke-width="2" class="private"/>
    <text x="78" y="490" class="boxTitle">Web Application</text>
    <text x="78" y="516" class="boxText"><tspan x="78" dy="0">Next.js / React</tspan><tspan x="78" dy="18">Candidate profiles</tspan><tspan x="78" dy="18">Job browsing</tspan></text>

    <rect x="286" y="462" width="210" height="116" rx="14" fill="#17152d" stroke-width="2" class="private"/>
    <text x="306" y="490" class="boxTitle">Persistence</text>
    <text x="306" y="516" class="boxText"><tspan x="306" dy="0">PostgreSQL / Prisma</tspan><tspan x="306" dy="18">Jobs / snapshots</tspan><tspan x="306" dy="18">Application state</tspan></text>

    <rect x="514" y="462" width="210" height="116" rx="14" fill="#17152d" stroke-width="2" class="private"/>
    <text x="534" y="490" class="boxTitle">Product Workflows</text>
    <text x="534" y="516" class="boxText"><tspan x="534" dy="0">Authentication foundations</tspan><tspan x="534" dy="18">Resume workflows</tspan><tspan x="534" dy="18">Application tracking</tspan></text>

    <rect x="742" y="462" width="210" height="116" rx="14" fill="#17152d" stroke-width="2" class="private"/>
    <text x="762" y="490" class="boxTitle">ATS / Job Sources</text>
    <text x="762" y="516" class="boxText"><tspan x="762" dy="0">Connector architecture</tspan><tspan x="762" dy="18">Selected integrations</tspan><tspan x="762" dy="18">Governed scheduled imports</tspan></text>

    <rect x="970" y="462" width="172" height="116" rx="14" fill="#17152d" stroke-width="2" class="private"/>
    <text x="990" y="490" class="boxTitle">AI Assistance</text>
    <text x="990" y="516" class="boxText"><tspan x="990" dy="0">Resume/job analysis</tspan><tspan x="990" dy="18">Suggestions</tspan><tspan x="990" dy="18">Interview prep</tspan></text>
  </g>

  <text x="58" y="624" class="section" fill="#ffc85a">◐ CURRENTLY STRENGTHENING</text>
  <rect x="58" y="646" width="1084" height="58" rx="14" fill="#2a2110" stroke="#f6b84a" stroke-width="2"/>
  <text x="78" y="680" class="boxText">Private-monorepo test coverage · Playwright end-to-end coverage · retry/backoff + connector observability · formal matching evaluation</text>

  <text x="58" y="722" class="small">Public claims map to the recruiter-safe repository. Private and in-progress capabilities remain explicitly separated.</text>
</svg>